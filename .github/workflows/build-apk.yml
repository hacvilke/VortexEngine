name: Build Vortex Engine APKs

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # (runner images ship the Android SDK + sdkmanager; the old
      #  android-actions/setup-android@v3 step dies on obsolete 'tools')

      - name: Install Platform 34 & Build-Tools 34.0.0
        run: |
          SDKM="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - name: Build Vortex Engine Studio APK & Runtime Toolchain
        env:
          ANDROID_SDK_ROOT: ${{ ANDROID_HOME || '/usr/local/lib/android/sdk' }}
        run: |
          chmod +x scripts/*.sh scripts/termux/*.sh
          ./scripts/build_studio_apk.sh

      - name: Run End-to-End Termux APK Pipeline Test
        env:
          ANDROID_SDK_ROOT: ${{ ANDROID_HOME || '/usr/local/lib/android/sdk' }}
        run: |
          ./scripts/test_termux_pipeline.sh

      - name: Upload Signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: VortexEngine-Signed-APKs
          path: |
            dist/VortexEngine-Studio-v1.0.0.apk
            dist/NeonHorizon3D-Sample.apk

name: Vortex Engine v4.3 Multi-Platform Build (Android APK + Windows EXE + Linux + HTML5 Web)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-all-platforms:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Vortex Engine
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK 34
        uses: android-actions/setup-android@v3

      - name: Install Android Build-Tools 34.0.0, MinGW-w64 & hacvilke/lrm CLI
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 zip unzip file curl
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          curl -fsSL https://raw.githubusercontent.com/hacvilke/lrm/main/scripts/install.sh | sh || true

      - name: Build Android Studio v4.3.0 APK
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          chmod +x scripts/*.sh scripts/termux/*.sh
          ./scripts/build_studio_apk.sh

      - name: Build Windows x64 .EXE, Linux x86_64 Binary & Desktop .JAR
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$HOME/.local/bin:$PATH"
          ./scripts/build_desktop.sh

      - name: Verify Termux APK Pipeline (--fast & --from-source), Native Java + ES6 HTML5 Export & Headless Tests
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$HOME/.local/bin:$PATH"
          ./scripts/test_termux_pipeline.sh

      - name: Upload Multi-Platform Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VortexEngine-v4.3.0-All-Platforms
          path: |
            dist/VortexEngine-Studio-v4.3.0.apk
            dist/VortexEngine-Studio-Windows-x64.exe
            dist/VortexEngine-Studio-Linux-x86_64
            dist/VortexEngine-Studio-Desktop-v4.3.0.jar

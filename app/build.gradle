apply plugin: "com.android.application"

android {
    namespace "com.vortex.engine.studio"
    compileSdk 34

    defaultConfig {
        applicationId "com.vortex.engine.studio"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "4.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
}
